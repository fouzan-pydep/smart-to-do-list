<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

{% block content %}
<div class="container mt-5">
    <h2 class="text-primary mb-4">Your High Priority Tasks</h2>

    {% if tasks %}
        <ul class="list-group">
            {% for task in tasks %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <strong>{{ task.title }}</strong> <br>
                        <small class="text-muted">Due: {{ task.due_date }}</small>
                    </div>
                    <div>
                        <a href="{% url 'task_high_update' task.id %}" class="btn btn-sm btn-outline-primary me-2">Edit</a>
                        <a href="{% url 'task_high_delete' task.id %}" class="btn btn-sm btn-outline-danger">Delete</a>
                    </div>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <div class="alert alert-info mt-3">You have no high priority tasks yet.</div>
    {% endif %}
</div>
{% endblock %}
<a href="{% url 'home' %}">home</a>
