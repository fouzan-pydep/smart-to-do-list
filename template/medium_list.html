
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

{% block content %}
<div class="container mt-5">
    <h2 class="text-warning mb-4">Medium Priority Tasks</h2>

    <a href="{% url 'medium' %}" class="btn btn-outline-primary mb-4">+ Add New Task</a>

    {% if tasks %}
        <div class="table-responsive">
            <table class="table table-striped table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Title</th>
                        <th>Due Date</th>
                        <th>AI Score</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for task in tasks %}
                        <tr>
                            <td>{{ task.title }}</td>
                            <td>{{ task.due_date }}</td>
                            <td>{{ task.ai_priority_score }}</td>
                            <td>
                                <a href="{% url 'task_medium_update' task.id %}" class="btn btn-sm btn-warning me-2">Edit</a>
                                <a href="{% url 'task_medium_delete' task.id %}" class="btn btn-sm btn-danger">Delete</a>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    {% else %}
        <div class="alert alert-info mt-3">No medium-priority tasks found.</div>
    {% endif %}
</div>
{% endblock %}
